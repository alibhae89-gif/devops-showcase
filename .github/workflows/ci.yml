name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-showcase:${{ github.sha }} .

      - name: Run container and test health endpoint
        run: |
          docker network create testnet
          docker run -d --name redis --network testnet redis:7-alpine
          docker run -d --name web --network testnet -e REDIS_HOST=redis -p 5000:5000 devops-showcase:${{ github.sha }}
          sleep 3
          curl --fail http://localhost:5000/health

      - name: Clean up
        if: always()
        run: docker rm -f web redis || true
